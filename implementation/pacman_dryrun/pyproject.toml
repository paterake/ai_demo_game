[project]
name = "ai-pacman-dryrun"
version = "0.1.0"
description = "Pac-Man workshop demo module: modular, config-driven Pygame implementation"
requires-python = ">=3.11, <3.14"
readme = "README.md"
dependencies = [
  "pygame>=2.6.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
]

[project.scripts]
ai-pacman = "ai_pacman.game:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pacman"]
